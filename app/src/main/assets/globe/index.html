<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GLOBE</title>
<link rel="stylesheet" href="./maplibre-gl.css">
<style>
  /* The room, not a web page. Ground is ink before any tile arrives, so the
     surface never flashes white on load. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060708;
    color: #F3F5F4;
    font-family: ui-monospace, "Roboto Mono", monospace;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #globe {
    position: absolute;
    inset: 0;
    background: #060708;
  }
  /* MapLibre injects its own controls and credits; both are replaced by the
     plates the native screen draws on top, so the canvas carries only imagery. */
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo, .maplibregl-ctrl-bottom-right,
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-top-right, .maplibregl-ctrl-top-left {
    display: none !important;
  }
  #fault {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #E05A48;
    background: #060708;
  }
</style>
</head>
<body>
<div id="globe"></div>
<div id="fault"></div>
<script type="module" src="./globe.js"></script>
</body>
</html>
