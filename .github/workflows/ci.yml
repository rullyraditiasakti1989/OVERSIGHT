name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v4 already drops the retired `tools` package and adds sdkmanager to PATH.
      - uses: android-actions/setup-android@v4

      - name: Install SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate a throwaway release keystore
        run: |
          keytool -genkeypair -v \
            -keystore ci.jks -storepass ci2026 -keypass ci2026 \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=OVERSIGHT CI" >/dev/null
          printf 'storeFile=ci.jks\nstorePassword=ci2026\nkeyAlias=ci\nkeyPassword=ci2026\n' > keystore.properties

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease lintDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: oversight-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
